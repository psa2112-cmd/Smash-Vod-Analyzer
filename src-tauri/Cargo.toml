[package]
name = "smash-replay-analyzer"
version = "0.1.0"
description = "Video-first Smash Ultimate replay review workspace"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
regex = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
